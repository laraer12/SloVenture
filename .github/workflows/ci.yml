name: CI/CD

on:
  push:
    branches:
      - develop
      - release
      - SCRUM-93-Neprekinjena-integracija-in-neprekinjena-dostava

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Build and push backend
      run: |
        cd SloVenture/backend
        docker build -t ${{ secrets.DOCKER_USERNAME }}/sloventure-backend:latest .
        docker push ${{ secrets.DOCKER_USERNAME }}/sloventure-backend:latest

    - name: Generate .env.production file
      run: |
        echo "${{ secrets.FRONTEND_ENV_PRODUCTION }}" > frontend/.env
    
    - name: Build and push frontend
      run: |
        cd ../frontend
        docker build -t ${{ secrets.DOCKER_USERNAME }}/sloventure-frontend:latest .
        docker push ${{ secrets.DOCKER_USERNAME }}/sloventure-frontend:latest

    - name: Trigger webhook on Azure
      uses: distributhor/workflow-webhook@v3
      with:
        url: ${{ secrets.WEBHOOK_URL }}
        method: POST
        body: '{"event":"new_release"}'
        headers: |
          Content-Type: application/json
          X-Hook-Secret: ${{ secrets.WEBHOOK_SECRET }}