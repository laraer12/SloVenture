name: CI - Build and Test

on:
  push:
    branches:
      - devel
      - release

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        cd backend
        npm install
        cd ../frontend
        npm install

    - name: Run backend tests
      run: |
        cd backend
        npm run test

    - name: Run frontend tests
      run: |
        cd frontend
        npm run test
